name: Keep Render API awake

# Render's free web services sleep after 15 minutes without inbound traffic, and a sleeping (or restarted)
# instance loses its SQLite database. Ping every 10 minutes: GitHub often starts scheduled runs a few
# minutes late, so this leaves margin under the 15-minute limit.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          API_URL: ${{ vars.API_URL || 'https://signal-clone-asm20-api.onrender.com' }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 "$API_URL/api/health" \
            || echo "Ping failed (service may be deploying); the next run will try again."
