name: Keep Render API awake

# Render's free web services sleep after 15 minutes without inbound traffic.
# Pinging every 5 minutes (offset from :00, when GitHub's scheduler is busiest)
# leaves room for delayed or dropped scheduled runs.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          API_URL: ${{ vars.API_URL || 'https://signal-clone-asm20-api.onrender.com' }}
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 "$API_URL/api/health"
