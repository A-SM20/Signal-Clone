name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -ra 2>&1 | tee pytest.log
      - name: Show failures on the run page
        if: failure()
        shell: bash
        run: |
          { echo '### Backend test failures'; echo '```'; grep -E "^(FAILED|ERROR)|Error|assert" pytest.log | head -40; echo; tail -80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
